  <title>سرّ الدعوة — صلاح ولجين</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2224%22%20fill%3D%22%23260e19%22%2F%3E%3Crect%20x%3D%226%22%20y%3D%226%22%20width%3D%2288%22%20height%3D%2288%22%20rx%3D%2220%22%20stroke%3D%22%23b99255%22%20fill%3D%22none%22%20stroke-width%3D%221.5%22%2F%3E%3Cpath%20d%3D%22M50%2012v15m0%2046v15M12%2050h15m46%200h15%22%20stroke%3D%22%23d8b879%22%20stroke-width%3D%221%22%2F%3E%3Ccircle%20cx%3D%2243%22%20cy%3D%2251%22%20r%3D%2218%22%20stroke%3D%22%23d8b879%22%20stroke-width%3D%224%22%20fill%3D%22none%22%2F%3E%3Ccircle%20cx%3D%2257%22%20cy%3D%2251%22%20r%3D%2218%22%20stroke%3D%22%23f1d7a2%22%20stroke-width%3D%224%22%20fill%3D%22none%22%2F%3E%3Cpath%20d%3D%22M50%2016l8%2010-8%208-8-8Z%22%20fill%3D%22%23f1d7a2%22%2F%3E%3C%2Fsvg%3E%0A" type="image/svg+xml" />

  <style>
:root {
  --night:#1b0b13; --wine:#34111f; --wine2:#471b2b; --plum:#5c2735;
  --gold:#c5a266; --gold-bright:#f0d7a1; --gold-dim:#80613e;
  --cream:#f7f0e3; --ivory:#fff9eb; --ink:#422633;
  --font-display:'Aref Ruqaa','Amiri',serif;
  --font-arabic:'Amiri',Georgia,serif;
  --font-ui:'Cairo',system-ui,sans-serif;
  --shadow:0 40px 100px rgba(7,0,4,.5);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{min-width:320px;margin:0;min-height:100vh;overflow-x:hidden;background:var(--night);color:var(--cream);font-family:var(--font-arabic);-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
a{color:inherit}
::selection{background:#bb925d;color:#251018}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.grain{pointer-events:none;position:fixed;inset:0;z-index:90;opacity:.1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.63' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E")}
.starfield{position:fixed;z-index:-2;inset:0;background:radial-gradient(ellipse at 50% 5%,#602b3d 0%,#2c101d 39%,#170912 80%),radial-gradient(circle at 45% 25%,rgba(255,210,142,.12),transparent 40%)}
.starfield:before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,#eccb94 0.65px,transparent 1px),radial-gradient(circle,#eccb94 .45px,transparent 1px);background-size:103px 129px,181px 157px;background-position:22px 48px,67px 32px;opacity:.22}
.aurora{position:fixed;z-index:-1;pointer-events:none;width:46vw;height:46vw;min-width:280px;min-height:280px;border-radius:50%;filter:blur(110px);opacity:.1;animation:glow-shift 16s ease-in-out infinite alternate}
.aurora--one{left:-25vw;top:10%;background:#f0b16d}
.aurora--two{right:-25vw;bottom:-20%;background:#c63a5c;animation-delay:-8s}
.micro{font:600 9px/1.8 var(--font-ui);letter-spacing:.36em;text-transform:uppercase;color:var(--gold-bright)}
.decor-line{height:1px;width:42px;max-width:20%;background:linear-gradient(90deg,transparent,var(--gold))}
.gate{min-height:100svh;display:flex;align-items:center;flex-direction:column;padding:30px 18px 24px;position:relative}
.gate-topline{display:flex;align-items:center;gap:15px;margin-bottom:22px;white-space:nowrap;opacity:.65}
.gate-topline .decor-line:last-child{transform:rotate(180deg)}
.gate-shell{position:relative;width:min(100%,480px);padding:10px;border:1px solid rgba(218,175,110,.65);border-radius:210px 210px 15px 15px/125px 125px 15px 15px;background:linear-gradient(150deg,rgba(235,188,121,.06),rgba(50,18,35,.75));box-shadow:0 30px 90px #09030a88,0 0 0 7px rgba(162,114,69,.04);isolation:isolate}
.gate-shell:after{content:"";position:absolute;inset:16px;pointer-events:none;border:1px solid rgba(233,194,128,.28);border-radius:195px 195px 9px 9px/112px 112px 9px 9px}
.gate-shell-inner{position:relative;z-index:1;padding:46px clamp(17px,5vw,45px) 20px;text-align:center}
.gate-ornament{width:58px;height:58px;position:absolute;z-index:2;pointer-events:none;background:linear-gradient(135deg,var(--gold-bright),transparent) top left/1px 100% no-repeat,linear-gradient(135deg,var(--gold-bright),transparent) top left/100% 1px no-repeat;opacity:.55}
.gate-ornament--tr{right:25px;top:120px;transform:rotate(90deg)}
.gate-ornament--tl{left:25px;top:120px}
.gate-ornament--br{right:15px;bottom:14px;transform:rotate(180deg)}
.gate-ornament--bl{left:15px;bottom:14px;transform:rotate(270deg)}
.top-gem{display:grid;place-items:center;margin:0 auto 18px;color:var(--gold-bright);width:44px;height:44px;border:1px solid rgba(222,180,103,.4);transform:rotate(45deg);font-size:18px}
.top-gem::first-letter{transform:rotate(-45deg)}
.gate-eyebrow{font:600 10px/1.5 var(--font-ui);letter-spacing:.22em;color:var(--gold);margin:0 0 12px}
.gate-title{font:400 clamp(32px,8.1vw,46px)/1.7 var(--font-display);margin:0;color:var(--ivory);text-shadow:0 2px 40px #f5c68422}
.gate-title em{font-style:normal;color:var(--gold-bright)}
.gate-title span{display:block;font-size:.76em;margin-top:-5px}
.ornamental-divider{display:flex;gap:14px;align-items:center;justify-content:center;color:var(--gold);height:20px;margin:14px auto 6px}
.ornamental-divider span{height:1px;width:60px;background:linear-gradient(90deg,transparent,#b48c54)}
.ornamental-divider span:last-child{transform:rotate(180deg)}
.ornamental-divider b{font-weight:400;font-size:19px}
.envelope-scene{height:183px;position:relative;display:grid;place-items:center;perspective:800px;filter:drop-shadow(0 22px 22px #0b0308aa)}
.envelope-light{position:absolute;width:240px;height:190px;background:radial-gradient(ellipse,#e6bc7e22,transparent 70%);animation:breathe 5s ease-in-out infinite}
.envelope{height:137px;width:226px;position:relative;transform:rotate(-3deg);transform-style:preserve-3d}
.envelope-back{position:absolute;inset:0;background:linear-gradient(145deg,#eedcc4,#c7aa84);border-radius:3px;box-shadow:0 0 1px #d8c397;overflow:hidden}
.envelope-letter{position:absolute;top:13px;right:21px;left:21px;height:103px;background:linear-gradient(165deg,#fff9eb,#e5d6bd);text-align:center;display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:0 2px 5px #70442a55;transition:transform 1s ease .45s;z-index:1;border:1px solid #b9996f}
.letter-mark{font:400 30px/1 Georgia,serif;letter-spacing:.18em;color:#875738}
.letter-mark small{font-size:14px;letter-spacing:0}
.letter-caption{font:400 7px/2 Georgia,serif;color:#806c5c;letter-spacing:.3em;text-transform:uppercase}
.envelope-flap{position:absolute;inset:0;z-index:3;clip-path:polygon(0 0,100% 0,50% 69%);background:linear-gradient(180deg,#f7e8d5,#c5a783);transform-origin:50% 0;backface-visibility:visible;transition:transform 1.2s cubic-bezier(.18,.7,.2,1) .1s}
.envelope-front{position:absolute;z-index:4;inset:0;clip-path:polygon(0 0,50% 62%,100% 0,100% 100%,0 100%);background:linear-gradient(160deg,#d7b99a,#efe0c7 50%,#d3b38d);box-shadow:inset 0 0 0 1px #c8a47d}
.envelope-front:after{content:"";position:absolute;inset:0;background:linear-gradient(23deg,#bfa07b00,#fff7e72c,#bfa07b00)}
.wax-seal{position:absolute;z-index:6;top:53px;left:50%;width:59px;height:59px;display:grid;place-items:center;transform:translateX(-50%) rotate(7deg);border-radius:46% 52% 49% 55%;background:radial-gradient(circle at 29% 27%,#c99d69,#8e5638 64%,#683420);box-shadow:0 3px 0 #5c3325,0 5px 16px #3920166f;transition:opacity .35s,transform .35s}
.wax-rim{border-radius:50%;width:44px;height:44px;display:grid;place-items:center;border:1px solid #e2b8898c;box-shadow:inset 0 0 5px #49221266,0 0 0 2px #653c2933}
.wax-rim span{font:17px Georgia,serif;letter-spacing:-.12em;padding-right:3px;color:#f8e1ba}
.gate.is-unlocking .envelope-flap{transform:rotateX(180deg)}
.gate.is-unlocking .envelope-letter{transform:translateY(-94px)}
.gate.is-unlocking .wax-seal{opacity:0;transform:translateX(-50%) scale(1.5)}
.gate.is-unlocking .envelope-light{background:radial-gradient(ellipse,#fce8b877,transparent 70%);transform:scale(1.6)}
.gate.is-unlocking .gate-shell{animation:gate-out .85s ease 1.25s both}
.puzzle-copy{margin-top:0}
.puzzle-label{font:600 11px var(--font-ui);color:#c7a476;letter-spacing:.02em;margin:5px 0 13px}
.puzzle-label span{font:italic 17px Georgia,serif;padding-left:7px}
.riddle{font:400 clamp(19px,5vw,23px)/1.9 var(--font-arabic);color:#efe3ce;margin:0 0 22px}
.riddle strong{font-weight:700;color:#f4d7a0}
.riddle-form{display:grid;gap:10px;max-width:315px;margin:auto}
.riddle-form input{width:100%;height:49px;border:1px solid #9c7753;background:#f4e9d9;box-shadow:inset 0 1px 5px #ae967333;text-align:center;outline:none;border-radius:4px;color:#422533;font:500 15px var(--font-ui);transition:border .25s,box-shadow .25s}
.riddle-form input::placeholder{color:#886f70}
.riddle-form input:focus{border-color:#f7dca7;box-shadow:0 0 0 3px #dfba7f42}
.riddle-form input.shake{animation:shake .5s ease}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:13px;text-decoration:none;border:1px solid transparent;min-height:48px;padding:10px 23px;border-radius:4px;font:600 14px/1.5 var(--font-ui);transition:transform .2s,background .2s,box-shadow .2s,border-color .2s;position:relative}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:focus-visible{outline:2px solid #f0d6a4;outline-offset:4px}
.btn-gold{background:linear-gradient(120deg,#9f7847 0%,#e3c28a 48%,#ba9259 100%);color:#2c1621;border:1px solid #efd3a4;box-shadow:0 6px 18px #05010644, inset 0 1px #fff1ce88}
.btn-gold:hover{box-shadow:0 11px 24px #05010666,0 0 14px #f5dbac44}
.button-arrow{font:23px Georgia,serif;font-weight:400;margin-left:-11px;transform:scaleX(-1)}
.riddle-feedback{font:500 12px/1.7 var(--font-ui);color:#f6c7a8;min-height:20px;margin:10px 0 0}
.gate-foot{font:400 14px/1.8 var(--font-arabic);opacity:.65;margin:6px 0 0;color:#f9e7c7}
.gate-bottom{margin-top:20px;opacity:.45;font-size:8px;text-align:center}

/* Revealed celebration */
.revealed{animation:reveal-body 1.4s ease both;min-height:100vh}
.hero{min-height:min(820px,100svh);padding:35px 23px 105px;text-align:center;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;isolation:isolate;overflow:hidden}
.hero:before{content:"";position:absolute;z-index:-1;width:min(820px,130vw);height:min(820px,130vw);border:1px solid #c29e4a35;border-radius:50%;box-shadow:0 0 0 36px #d7b17309,0 0 0 87px #bf88460c,0 0 0 155px #dfbc6c07;top:50%;left:50%;transform:translate(-50%,-50%)}
.hero-circle{position:absolute;border-radius:50%;border:1px solid #dbb77825;width:min(510px,90vw);height:min(510px,90vw);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
.hero-circle:after{content:"✦";position:absolute;top:-12px;left:50%;color:var(--gold);font-size:17px}
.hero-overline{display:flex;align-items:center;justify-content:center;gap:15px;margin:16px 0 26px;opacity:.9}
.hero-overline span{height:1px;width:55px;background:linear-gradient(90deg,transparent,#bd995a)}
.hero-overline span:last-child{transform:scaleX(-1)}
.hero-overline em{font:600 10px var(--font-ui);letter-spacing:.14em;font-style:normal;color:#e3c28e}
.top-monogram{font:400 17px Georgia,serif;color:var(--gold-bright);letter-spacing:.22em;border:1px solid #dbb87877;display:grid;place-items:center;border-radius:50%;width:83px;height:83px;margin:0 auto 29px;position:relative;background:#31131f99}
.top-monogram:before,.top-monogram:after{content:"";position:absolute;inset:5px;border:1px solid #bd945c6b;border-radius:50%}
.top-monogram:after{inset:-9px;border:1px solid #bd945c3e}
.hero-kicker{font:400 27px/1.6 var(--font-display);color:#dfb97b;margin:0 0 20px}
.names{margin:0;display:flex;flex-direction:column;align-items:center;gap:0;font:400 clamp(72px,18vw,142px)/1.35 var(--font-display);letter-spacing:-.045em;color:#f3e5cb;text-shadow:0 0 30px #e3b87b33, 0 15px 35px #11050bbb}
.names>span{display:block}
.names i{font-style:normal;display:flex;align-items:center;gap:27px;color:#dbba83;font:400 22px/1 Georgia,serif;letter-spacing:.2em;transform:translateY(-4px)}
.names i:before,.names i:after{content:"";height:1px;width:63px;background:linear-gradient(90deg,transparent,#e1c188)}
.names i:after{transform:scaleX(-1)}
.hero-copy{font:400 clamp(18px,4.3vw,25px)/1.85 var(--font-arabic);color:#ddc9ae;max-width:490px;margin:24px 0 0}
.hero-arrow{position:absolute;bottom:31px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:9px;flex-direction:column;color:#cfb587;text-decoration:none;font:600 10px var(--font-ui);letter-spacing:.04em;opacity:.8}
.hero-arrow svg{width:17px;height:30px;animation:scrollcue 2.8s ease-in-out infinite}
.gold-particle{position:absolute;z-index:2;width:4px;height:4px;pointer-events:none;background:#efd5a6;border-radius:50%;box-shadow:0 0 11px #ffdca3;animation:twinkle 4.5s infinite alternate;opacity:.5}
.petal{position:absolute;z-index:0;pointer-events:none;width:9px;height:14px;border-radius:50% 0 50% 50%;border:1px solid #eedbc7b0;background:linear-gradient(120deg,#f7e8d180,#c59b9780);animation:petal-drift var(--duration,15s) linear infinite;animation-delay:var(--delay,0s);left:var(--x,50%);top:-6vh;opacity:.6}
.parchment-zone{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 5%,#fff9ec 0%,#f3e9d8 45%,#ead8bf 100%);color:var(--ink);padding:110px 22px 100px}
.parchment-zone:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.25;background-image:repeating-linear-gradient(0deg,#ac86590b 0 1px,transparent 1px 4px)}
.parchment-zone:after{content:"";position:absolute;top:-70px;left:-40px;width:220px;height:220px;border:1px solid #bfa07577;border-radius:50%;box-shadow:0 0 0 45px #e0b98b0e,0 0 0 85px #e0b98b0e}
.chapter{position:relative;text-align:center;max-width:720px;margin:0 auto 72px}
.chapter-label{font:600 10px var(--font-ui);letter-spacing:.24em;color:#967047;margin:0 0 24px}
.chapter-title{font:400 clamp(32px,8vw,54px)/1.7 var(--font-display);color:#532937;margin:0 0 12px}
.chapter-quote{font:400 clamp(20px,5vw,29px)/2 var(--font-arabic);max-width:600px;margin:16px auto;color:#745563}
.gold-ornament{display:flex;justify-content:center;align-items:center;gap:13px;color:#b88a54;font:23px Georgia,serif;margin:25px auto}
.gold-ornament:before,.gold-ornament:after{content:"";height:1px;width:90px;background:linear-gradient(90deg,transparent,#c69e62)}
.gold-ornament:after{transform:rotate(180deg)}
.invitation-card{max-width:770px;margin:0 auto;position:relative;padding:10px;background:#fbf3e5;border:1px solid #a37e4c;box-shadow:0 30px 90px #5b342539,0 6px 20px #7d57342b}
.invitation-card:before{content:"";position:absolute;inset:16px;pointer-events:none;border:1px solid #c6a67999}
.invitation-card:after{content:"";position:absolute;inset:24px;pointer-events:none;border:1px solid #c6a67950}
.card-corner{position:absolute;z-index:2;font:400 32px Georgia,serif;color:#c09b60;line-height:1;opacity:.85}
.card-corner.tr{right:16px;top:14px}.card-corner.tl{left:16px;top:14px}.card-corner.br{right:16px;bottom:14px}.card-corner.bl{left:16px;bottom:14px}
.card-inner{position:relative;padding:60px clamp(16px,7vw,76px) 63px;text-align:center;background:radial-gradient(ellipse at 50% 15%,#fffdfa 0%,#fbf3e5 70%,#f5e6d1 100%)}
.ring-art{display:block;width:135px;max-width:50%;height:95px;margin:0 auto 6px;filter:drop-shadow(0 5px 4px #9b784533)}
.card-eyebrow{color:#a17a50;font:600 10px var(--font-ui);letter-spacing:.2em;margin:5px 0 15px}
.card-name{font:400 clamp(48px,10vw,79px)/1.35 var(--font-display);color:#532635;margin:8px 0 4px}
.card-name span{color:#ad8555;margin:0 .16em;font-size:.55em;vertical-align:middle}
.card-description{font:400 clamp(20px,5vw,27px)/2 var(--font-arabic);margin:15px auto 0;max-width:480px;color:#6a4b54}
.event-details{max-width:560px;margin:48px auto 0;display:grid;gap:17px}
.date-center{padding:27px 15px 23px;border:1px solid #cfae7c;position:relative;background:linear-gradient(135deg,#f7ebd7,#fffaf0,#f3e4cd);box-shadow:inset 0 0 0 5px #fff8eb, inset 0 0 0 6px #ccb18766}
.date-center:before,.date-center:after{content:"✦";position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:#fcf2e4;padding:0 16px;color:#b58c53;font-size:15px}
.date-center:after{top:auto;bottom:-14px}
.date-weekday{display:block;font:400 30px/1.6 var(--font-display);color:#845165}
.date-main{display:block;font:400 clamp(26px,5vw,40px)/1.6 var(--font-display);color:#4e2330}
.date-west{display:block;font:500 11px Georgia,serif;letter-spacing:.23em;color:#9d7251;direction:ltr;margin-top:2px}
.detail-pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.detail-tile{padding:23px 10px;border:1px solid #c5a27088;background:#fff9ef}
.tile-icon{display:block;width:31px;height:31px;margin:0 auto 8px;color:#ae8658}
.detail-label{display:block;font:600 11px/1.8 var(--font-ui);color:#ac8250;margin:0 0 5px}
.detail-value{display:block;font:400 24px/1.5 var(--font-display);color:#4d2331}
.detail-extra{display:block;font:400 12px/1.5 var(--font-ui);color:#8e6e6d}
.venue-panel{border:1px solid #c5a27088;padding:30px 18px;background:#fff9ef}
.venue-name{font:400 clamp(25px,6vw,38px)/1.5 var(--font-display);color:#502734;margin:5px 0}
.venue-city{font:400 19px/1.5 var(--font-arabic);color:#7e6570;margin:0}
.card-closing{font:400 clamp(20px,5vw,27px)/1.8 var(--font-display);color:#795663;max-width:450px;margin:40px auto 0}
.section-dark{position:relative;text-align:center;padding:90px 22px;background:radial-gradient(ellipse at 50% 50%,#4a1b2b 0%,#270e1a 65%,#1b0b13 100%)}
.section-overline{font:600 11px var(--font-ui);letter-spacing:.2em;color:#b9996c;margin:0 0 14px}
.section-title{font:400 clamp(33px,7vw,55px)/1.5 var(--font-display);color:#f4e4c7;margin:0 auto 20px}
.section-caption{font:400 19px/1.8 var(--font-arabic);color:#d0b6a9;margin:0 auto 30px;max-width:530px}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:640px;margin:28px auto 0;direction:rtl}
.count-tile{border:1px solid #c69f6955;background:#f3ddb112;padding:19px 5px 14px;box-shadow:inset 0 0 0 5px #170a0f25}
.count-number{display:block;color:#f4dcae;font:400 clamp(27px,6vw,54px)/1.25 Georgia,serif;font-variant-numeric:tabular-nums}
.count-label{display:block;color:#d4b594;font:500 11px/2 var(--font-ui)}
.count-note{font:500 11px var(--font-ui);color:#c4a27c;opacity:.8;margin:21px 0 0}
.actions-area{margin:70px auto 0;max-width:780px;padding:0 10px;text-align:center}

function normalizeArabic(input) {
  return String(input).normalize('NFKC')
    .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g, '')
    .replace(/[أإآٱ]/g, 'ا')
    .replace(/ؤ/g, 'و').replace(/ئ|ى/g, 'ي').replace(/ة/g, 'ه')
    .replace(/[^\p{L}\p{N}]/gu, '').trim().toLowerCase();
}
function isCorrectAnswer(answer) {
  let normalized = normalizeArabic(answer);
  if (normalized.startsWith('ال')) normalized = normalized.slice(2);
  return ['خاتم', 'محبس', 'دبله', 'ring'].includes(normalized);
}

function startGate() {
  const form = document.querySelector('#riddle-form');
  if (!form) return;
  const input = document.querySelector('#riddle-answer');
  const feedback = document.querySelector('#riddle-feedback');
  const button = document.querySelector('#unlock-button');
  const gate = document.querySelector('#gate');
  let wrong = 0;
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (gate.classList.contains('is-unlocking')) return;
    if (!isCorrectAnswer(input.value)) {
      wrong++;
      feedback.textContent = wrong > 1 ? 'فكّر بشيءٍ يوضع في البنصر… جرب مرة أخرى ✦' : 'قريب من قلب الحكاية، لكن المفتاح ليس هذا…';
      input.classList.remove('shake');
      void input.offsetWidth;
      input.classList.add('shake');
      input.setAttribute('aria-invalid', 'true');
      input.focus();
      return;
    }
    feedback.textContent = 'انكشف السر… أهلًا بك في حكايتنا ✦';
    input.setAttribute('aria-invalid', 'false');
    input.disabled = true;
    button.disabled = true;
    gate.classList.add('is-unlocking');
    try { sessionStorage.setItem(SESSION_KEY, 'yes'); } catch { /* restricted storage */ }
    window.setTimeout(renderInvitation, prefersReducedMotion ? 90 : 1900);

}

function setCountdown() {

  const difference = Math.max(0, eventTime - Date.now());
  const total = Math.floor(difference / 1000);
  const nums = [Math.floor(total / 86400), Math.floor(total % 86400 / 3600), Math.floor(total % 3600 / 60), total % 60];
  ['days','hours','minutes','seconds'].forEach((id, index) => { document.getElementById(id).textContent = String(nums[index]).padStart(index ? 2 : 1, '0'); });

    document.getElementById('count-note').textContent = 'حلّ يوم الفرحة… شكرًا لأنكم معنا ♡';
    if (countdownInterval) clearInterval(countdownInterval);
  }

  const now = icsDateUTC(Date.now());
  const lines = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Salah and Lujain//Invitation//AR',
    'CALSCALE:GREGORIAN','BEGIN:VEVENT',
    'UID:salah-lujain-engagement-20270103@example.invalid',
    `DTSTAMP:${now}`,`DTSTART:${start}`,`DTEND:${end}`,
    `SUMMARY:خطوبة ${EVENT.groom} ولجين`,
    `LOCATION:${EVENT.venue} - ${EVENT.city}`,
    'DESCRIPTION:يسعدنا حضوركم لمشاركتنا فرحة الخطوبة.',
    'END:VEVENT','END:VCALENDAR'
  ];
  const blob = new Blob(['\ufeff' + lines.join('\r\n') + '\r\n'],{type:'text/calendar;charset=utf-8'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'Salah-Lujain-Engagement.ics';
  document.body.appendChild(link);link.click();link.remove();
  window.setTimeout(()=>URL.revokeObjectURL(link.href),500);
  setStatus('تم تجهيز موعد الخطوبة لإضافته إلى تقويمك ✦');
}
async function copyInviteURL() {
  try {
    if (!navigator.clipboard?.writeText) throw Error('Clipboard unavailable');
    await navigator.clipboard.writeText(window.location.href);
    setStatus('تم نسخ رابط الدعوة ✦');
  } catch {
    // Non-secure local file URLs may not support the Clipboard API.
    const box = document.createElement('input'); box.value = window.location.href;
    box.style.cssText='position:fixed;opacity:0;top:0;';document.body.appendChild(box);box.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch {}
    box.remove();
    setStatus(ok ? 'تم نسخ رابط الدعوة ✦' : 'يمكنك نسخ الرابط مباشرة من شريط العنوان');
  }
}
function shareWhatsApp() {
  const text = `لديك دعوة خاصة من صلاح ولجين 💍✨\nلكن تفاصيلها مخبّأة خلف أحجية صغيرة... هل تستطيع فتح السر؟\n\n${window.location.href}`;
  const href = `https://wa.me/?text=${encodeURIComponent(text)}`;
  window.open(href, '_blank', 'noopener,noreferrer');
  setStatus('تم فتح مشاركة الدعوة عبر واتساب');
}
function initReveal() {
  if (revealObserver) revealObserver.disconnect();
  const elements = [...document.querySelectorAll('[data-reveal]')];
  if (!('IntersectionObserver' in window) || prefersReducedMotion) { elements.forEach(el=>el.classList.add('seen'));return; }
  revealObserver = new IntersectionObserver(entries=>entries.forEach(item=>{if(item.isIntersecting){item.target.classList.add('seen'); revealObserver.unobserve(item.target);}}),{threshold:.08});
  elements.forEach(el=>revealObserver.observe(el));
}
function addParticleEffects() {
  const hero = document.querySelector('.hero');
  if (!hero || prefersReducedMotion) return;
  // Fixed decorative geometry, no network or external assets.
  for (let i=0;i<20;i++) {
    const point=document.createElement('span');point.className='gold-particle';
    point.style.left=`${(i*47+9)%98}%`;point.style.top=`${(i*37+13)%92}%`;
    point.style.animationDelay=`-${i*.41}s`;point.style.animationDuration=`${3+i%4}s`;
    hero.appendChild(point);
  }
  for(let i=0;i<9;i++) {
    const petal=document.createElement('span');petal.className='petal';
    petal.style.setProperty('--x',`${(i*17+4)%96}%`);
    petal.style.setProperty('--drift',`${(i%2 ? -1:1)*(30+i*15)}px`);
    petal.style.setProperty('--duration',`${12+i*1.4}s`);
    petal.style.setProperty('--delay',`-${i*2.3}s`);
    hero.appendChild(petal);
  }
}
function renderInvitation() {
  if(countdownInterval) clearInterval(countdownInterval);
  const app = document.getElementById('app');
  app.innerHTML = invitationMarkup();
  window.scrollTo({top:0,left:0,behavior:'instant'});
  setCountdown();countdownInterval = window.setInterval(setCountdown,1000);
  document.getElementById('calendar-button').addEventListener('click', downloadCalendar);
  document.getElementById('copy-button').addEventListener('click', copyInviteURL);
  document.getElementById('share-button').addEventListener('click', shareWhatsApp);
  document.getElementById('replay-button').addEventListener('click', () => {
    try { sessionStorage.removeItem(SESSION_KEY); } catch {}
    window.location.reload();
  });
  document.getElementById('seal-button').addEventListener('click',function(){
    const seal=document.getElementById('seal-message');
    seal.classList.toggle('is-visible');
    this.setAttribute('aria-expanded',String(seal.classList.contains('is-visible')));
  });
  initReveal();addParticleEffects();
  document.getElementById('announcement').textContent='انكشف السر، أهلاً بكم في دعوة خطوبة صلاح ولجين';
}
function start() {
  try {if(sessionStorage.getItem(SESSION_KEY)==='yes'){renderInvitation();return;}}catch{}
  startGate();
}
start();
